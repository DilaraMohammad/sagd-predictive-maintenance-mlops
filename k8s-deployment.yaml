apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagd-api-deployment
  labels:
    app: sagd-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sagd-api
  template:
    metadata:
      labels:
        app: sagd-api
    spec:
      containers:
      - name: sagd-api
        image: sagd-api:latest
        imagePullPolicy: Never  
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sagd-api-service
spec:
  type: NodePort
  selector:
    app: sagd-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080